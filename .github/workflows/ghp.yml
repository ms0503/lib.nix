jobs:
  generate-category-docs:
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v6"
      - name: "Remove unused tools"
        run: |
          sudo rm -rf \
            "$AGENT_TOOLSDIRECTORY" \
            "/etc/skel/.dotnet/tools" \
            "/home/.dotnet/tools" \
            "/home/.nvm" \
            "/home/linuxbrew" \
            "/home/perflog" \
            "/home/work/*" \
            "/opt/*" \
            "/usr/bin/composer" \
            "/usr/bin/docker-credential-ecr-login" \
            "/usr/bin/yq" \
            "/usr/lib/jvm" \
            "/usr/libexec/docker/cli-plugins" \
            "/usr/local/.ghcup" \
            "/usr/local/aws-cli" \
            "/usr/local/bin/.ghcup" \
            "/usr/local/bin/aliyun" \
            "/usr/local/bin/azcopy" \
            "/usr/local/bin/azcopy_11.3.1" \
            "/usr/local/bin/bicep" \
            "/usr/local/bin/bicep" \
            "/usr/local/bin/bicep" \
            "/usr/local/bin/ccmake" \
            "/usr/local/bin/cmake-gui" \
            "/usr/local/bin/cpack" \
            "/usr/local/bin/ctest" \
            "/usr/local/bin/docker-compose" \
            "/usr/local/bin/helm" \
            "/usr/local/bin/kind" \
            "/usr/local/bin/kubectl" \
            "/usr/local/bin/kustomize" \
            "/usr/local/bin/minikube" \
            "/usr/local/bin/oc" \
            "/usr/local/bin/oras" \
            "/usr/local/bin/packer" \
            "/usr/local/bin/phpunit" \
            "/usr/local/bin/phpunit" \
            "/usr/local/bin/pulumi" \
            "/usr/local/bin/pulumi-analyzer-policy" \
            "/usr/local/bin/pulumi-analyzer-policy-python" \
            "/usr/local/bin/pulumi-language-dotnet" \
            "/usr/local/bin/pulumi-language-go" \
            "/usr/local/bin/pulumi-language-java" \
            "/usr/local/bin/pulumi-language-nodejs" \
            "/usr/local/bin/pulumi-language-python" \
            "/usr/local/bin/pulumi-language-python-exec" \
            "/usr/local/bin/pulumi-language-yaml" \
            "/usr/local/bin/pulumi-resource-pulumi-nodejs" \
            "/usr/local/bin/pulumi-resource-pulumi-python" \
            "/usr/local/bin/pulumi-watch" \
            "/usr/local/bin/rebar3" \
            "/usr/local/bin/stack" \
            "/usr/local/bin/terraform" \
            "/usr/local/julia*" \
            "/usr/local/lib/android" \
            "/usr/local/lib/lein" \
            "/usr/local/share/boost" \
            "/usr/local/share/chromedriver-linux64" \
            "/usr/local/share/chromium" \
            "/usr/local/share/doc" \
            "/usr/local/share/edge_driver" \
            "/usr/local/share/emacs" \
            "/usr/local/share/fonts" \
            "/usr/local/share/gecko_driver" \
            "/usr/local/share/icons" \
            "/usr/local/share/man" \
            "/usr/local/share/phantomjs*" \
            "/usr/local/share/phantomjs-8.6" \
            "/usr/local/share/powershell" \
            "/usr/local/share/vcpkg" \
            "/usr/local/sqlpackage" \
            "/usr/share/apache-maven-3.8.8" \
            "/usr/share/dotnet" \
            "/usr/share/gradle-8.7" \
            "/usr/share/kotlinc" \
            "/usr/share/miniconda" \
            "/usr/share/sbt" \
            "/usr/share/swift" \
            || true
          sudo docker image prune --all --force
          sudo npm uninstall bazel bazelisk || true
          rustup self uninstall -y
          sudo apt-get purge -y -- \
            *-dev \
            ansible \
            ant \
            ant-optional \
            apache2 \
            aria2 \
            azure-cli \
            bind9-* \
            buildah \
            cabal* \
            clang* \
            cloud-* \
            cloud-initramfs* \
            docker-* \
            dotnet-sdk* \
            firefox \
            fonts-* \
            gcc-10 \
            gcc-11 \
            gcc-11-* \
            gcc-12 \
            gcc-12-* \
            gcc-9 \
            gfortran-13 \
            ghc* \
            gir1.2-* \
            golang-github-* \
            google-chrome-stable \
            google-cloud-cli \
            heroku \
            hicolor-icon-theme \
            imagemagick-* \
            javascript-common \
            kubectl \
            libfontconfig1-dev \
            libfreetype6-dev \
            libjs-* \
            libllvm* \
            liblz4-dev \
            libmysqlclient-dev \
            libpq-dev \
            libpq-dev \
            libxft-dev \
            linux-azure-6.2-* \
            linux-cloud-tools* \
            linux-headers-* \
            llvm-* \
            man-db \
            manpages \
            microsoft-edge-stable \
            moby-buildx \
            moby-cli \
            moby-compose \
            moby-engine \
            mongodb* \
            mono-complete \
            mssql-tools* \
            mysql* \
            nano \
            nginx \
            node* \
            npm* \
            nuget \
            openjdk-11-jre-headless \
            p7zip* \
            packages-microsoft-prod \
            perl \
            php* \
            podman \
            postgresql* \
            powershell \
            python3-* \
            r-base \
            rpm \
            ruby* \
            skopeo \
            skopeo \
            snmp \
            sphinxsearch \
            subversion \
            swig \
            tcl \
            tcl* \
            temurin-* \
            temurin-* \
            ubuntu-advantage-tools \
            unixodbc-dev \
            x11-* \
            yarn \
            || true
          sudo dpkg -r packages-microsoft-prod &>/dev/null || true
          sudo apt-get autoremove -y &>/dev/null || true
          sudo apt-get autoclean -y &>/dev/null || true
      - name: "Install Nix"
        uses: "cachix/install-nix-action@v31"
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = flakes nix-command pipe-operators
          github_access_token: "${{ secrets.GITHUB_TOKEN }}"
          nix_path: "nixpkgs=channel:nixos-unstable"
      - name: "Use Cachix"
        uses: "cachix/cachix-action@v17"
        with:
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          name: "ms0503"
          signingKey: "${{ secrets.CACHIX_SIGNING_KEY }}"
      - name: "Generate pages"
        run: |
          mkdir ./info
          nix run github:nix-community/nixdoc -- \
            -c "${{ matrix.category[0] }}" \
            -d "${{ matrix.category[1] }}" \
            -f "./lib/${{ matrix.category[0] }}.nix" \
            >"./docs/src/${{ matrix.category[0] }}.md"
          printf "${{ matrix.category[1] }}" >"./info/${{ matrix.category[0] }}"
      - name: "Upload page"
        uses: "actions/upload-artifact@v7"
        with:
          name: "docs-${{ matrix.category[0] }}"
          path: "./docs/src/${{ matrix.category[0] }}.md"
      - name: "Upload info"
        uses: "actions/upload-artifact@v7"
        with:
          name: "info-${{ matrix.category[0] }}"
          path: "./info/${{ matrix.category[0] }}"
    strategy:
      fail-fast: false
      matrix:
        category:
          - ["build", "Build supports"]
          - ["filters", "Source filter collection"]
          - ["math", "Math helpers"]
  build:
    needs: "generate-category-docs"
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v6"
      - name: "Get categories"
        uses: "actions/download-artifact@v8"
        with:
          merge-multiple: true
          path: "./info"
          pattern: "info-*"
      - name: "Download category pages"
        uses: "actions/download-artifact@v8"
        with:
          merge-multiple: true
          path: "./docs/src"
          pattern: "docs-*"
      - name: "Generate root page and summary"
        run: |
          printf "\n" >>./docs/src/SUMMARY.md
          while IFS= read -d '' -r info; do
            printf "\n## [lib.%s](./%s.md)\n\n%s\n" \
              "$info" "$info" "$(cat "./info/$info")" \
              >>./docs/src/home.md
            printf -- "- [lib.%s](./%s.md)\n" \
              "$info" "$info" \
              >>./docs/src/SUMMARY.md
          done < <(find ./info -type f -printf '%P\0' | sort -z)
      - name: "Setup mdbook"
        run: |
          cargo install mdbook --no-default-features
      - name: "Build"
        run: |
          cd docs
          mdbook build
      - name: "Upload"
        uses: "actions/upload-pages-artifact@v5"
        with:
          path: "./docs/book"
  deploy:
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true
    needs: "build"
    runs-on: "ubuntu-24.04"
    steps:
      - id: "deployment"
        name: "Deploy"
        uses: "actions/deploy-pages@v5"
name: "GitHub Pages"
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch:
permissions:
  contents: "read"
  id-token: "write"
  pages: "write"
